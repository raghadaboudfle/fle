<!DOCTYPE html>
<html lang="en">

<head>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ZNHDB8N2L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-5ZNHDB8N2L');
  </script>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>A2 Grammar | Français Sans Illusion</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="assets/logos/icon-light.svg"
  >

  <style>

    :root {
      --primary-blue: #1E5BB8;
      --dark-text: #1F2937;
      --white: #FFFFFF;

      /* A2 palette */
      --a2-orange: #F59E42;
      --a2-dark: #D97706;
      --a2-peach: #FFD8B5;
      --a2-light: #FFF1E5;
      --a2-border: #F6C99D;
      --a2-background: #FFF8F2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;

      font-family: Arial, Helvetica, sans-serif;
      color: var(--dark-text);

      background:
        radial-gradient(
          circle at top left,
          var(--a2-light),
          transparent 40%
        ),
        linear-gradient(
          180deg,
          #FFFFFF 0%,
          var(--a2-background) 100%
        );
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page-container {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 32px 22px 50px;
    }

    /* BACK */

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 38px;

      color: var(--primary-blue);
      font-size: 18px;
      font-weight: 700;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    /* HEADER */

    .page-header {
      max-width: 760px;
      margin: 0 auto 50px;

      text-align: center;
    }

    .level-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      padding: 8px 18px;
      margin-bottom: 22px;

      border-radius: 999px;

      background: var(--a2-orange);
      color: var(--white);

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;

      box-shadow:
        0 8px 20px rgba(245, 158, 66, 0.24);
    }

    .page-icon {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 110px;
      height: 110px;

      margin: 0 auto 24px;

      border: 2px solid var(--a2-border);
      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          #FFF8F2,
          var(--a2-light)
        );

      font-size: 54px;

      box-shadow:
        0 14px 30px rgba(217, 119, 6, 0.12);
    }

    .page-header h1 {
      margin-bottom: 18px;

      color: var(--primary-blue);

      font-size: clamp(38px, 7vw, 60px);
      line-height: 1.1;
    }

    .page-header p {
      color: #5F6570;

      font-size: clamp(18px, 3vw, 24px);
      line-height: 1.7;
    }

    /* LESSONS */

    .lessons-grid {
      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));

      gap: 24px;
    }

    .lesson-card {
      position: relative;

      display: flex;
      align-items: center;
      gap: 20px;

      min-height: 160px;
      padding: 26px;

      overflow: hidden;

      border: 2px solid var(--a2-border);
      border-radius: 28px;

      background:
        rgba(255, 255, 255, 0.96);

      box-shadow:
        0 14px 34px rgba(217, 119, 6, 0.09);

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .lesson-card::before {
      content: "";

      position: absolute;

      top: 0;
      bottom: 0;
      left: 0;

      width: 12px;

      background:
        linear-gradient(
          180deg,
          var(--a2-peach),
          var(--a2-orange)
        );
    }

    a.lesson-card {
      cursor: pointer;
    }

    a.lesson-card:hover {
      transform: translateY(-6px);

      border-color: var(--a2-orange);

      box-shadow:
        0 20px 42px rgba(217, 119, 6, 0.16);
    }

    a.lesson-card:focus-visible {
      outline:
        4px solid rgba(245, 158, 66, 0.25);

      outline-offset: 4px;
    }

    .lesson-icon {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 72px;
      height: 72px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          #FFF7EF,
          var(--a2-light)
        );

      font-size: 34px;
    }

    .lesson-content {
      flex: 1;
    }

    .lesson-content h2 {
      margin-bottom: 7px;

      color: var(--primary-blue);

      font-size: 23px;
      line-height: 1.3;
    }

    .lesson-content p {
      color: #6B7280;

      font-size: 15px;
      line-height: 1.5;
    }

    .lesson-arrow {
      flex: 0 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 42px;
      height: 42px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          var(--a2-orange),
          var(--a2-dark)
        );

      color: var(--white);

      font-size: 24px;
      font-weight: 700;

      box-shadow:
        0 8px 18px rgba(217, 119, 6, 0.20);
    }

    /* FOOTER */

    .brand-footer {
      margin-top: 70px;
      padding-top: 35px;

      border-top:
        1px solid var(--a2-border);

      text-align: center;
    }

    .footer-logo {
      display: block;

      width: 84px;
      height: 84px;

      margin: 0 auto 16px;

      object-fit: contain;
    }

    .brand-footer h2 {
      margin-bottom: 8px;

      color: var(--primary-blue);

      font-size: 24px;
    }

    .brand-footer p {
      color: #6B7280;

      font-size: 15px;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      .page-container {
        padding: 25px 18px 40px;
      }

      .back-link {
        margin-bottom: 30px;

        font-size: 17px;
      }

      .page-icon {
        width: 94px;
        height: 94px;

        border-radius: 26px;

        font-size: 46px;
      }

      .page-header {
        margin-bottom: 38px;
      }

      .lessons-grid {
        grid-template-columns: 1fr;

        gap: 18px;
      }

      .lesson-card {
        min-height: 135px;

        padding:
          22px 18px
          22px 24px;
      }

      .lesson-icon {
        width: 60px;
        height: 60px;

        border-radius: 17px;

        font-size: 29px;
      }

      .lesson-content h2 {
        font-size: 20px;
      }

      .lesson-content p {
        font-size: 14px;
      }

      .lesson-arrow {
        width: 38px;
        height: 38px;

        font-size: 21px;
      }
    }

  </style>

</head>

<body>

  <main class="page-container">

    <a
      class="back-link"
      href="learn-a2.html"
    >
      <span aria-hidden="true">←</span>
      Back to A2 Categories
    </a>


    <header class="page-header">

      <div class="level-badge">
        A2
      </div>

      <div
        class="page-icon"
        aria-hidden="true"
      >
        📖
      </div>

      <h1>A2 Grammar</h1>

      <p>
        Explore essential French grammar through
        clear explanations, examples and practical exercises.
      </p>

    </header>


    <section
      class="lessons-grid"
      aria-label="A2 grammar lessons"
    >

      <a
        class="lesson-card"
        href="cest-il-est.html"
        aria-label="Open the lesson C'est ou Il est"
      >

        <div
          class="lesson-icon"
          aria-hidden="true"
        >
          ⚖️
        </div>

        <div class="lesson-content">

          <h2>
            C’EST ou IL EST ?
          </h2>

          <p>
            Comment choisir la bonne forme ?
          </p>

        </div>

        <div
          class="lesson-arrow"
          aria-hidden="true"
        >
          →
        </div>

      </a>

    </section>


    <footer class="brand-footer">

      <img
        class="footer-logo"
        src="assets/logos/icon-light.svg"
        alt="Français Sans Illusion logo"
      >

      <h2>
        Français Sans Illusion
      </h2>

      <p>
        Designed with ❤️ &amp; AI by Raghad Aboud
      </p>

    </footer>

  </main>

</body>

</html>
